<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LinkFinder topology - __SEED__</title>
<style>
 :root { color-scheme: light; }
 * { box-sizing: border-box; }
 body { margin:0; font:13px/1.45 "Segoe UI",system-ui,sans-serif; color:#1a202c; }
 header { padding:10px 14px; background:#1a202c; color:#fff; display:flex;
          align-items:center; gap:16px; flex-wrap:wrap; }
 header h1 { font-size:15px; margin:0; font-weight:600; }
 header .meta { font-size:12px; opacity:.85; }
 #bar { padding:8px 14px; background:#edf2f7; border-bottom:1px solid #cbd5e0;
        display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
 #bar input, #bar select, #bar button { font:12px inherit; padding:4px 8px;
        border:1px solid #cbd5e0; border-radius:4px; background:#fff; }
 #bar button { cursor:pointer; }
 #wrap { display:flex; height:calc(100vh - 98px); }
 #cy { flex:1; background:#fff; }
 #side { width:340px; border-left:1px solid #cbd5e0; padding:12px 14px; overflow:auto;
         background:#f7fafc; }
 #side h2 { font-size:13px; margin:0 0 8px; }
 #side table { width:100%; border-collapse:collapse; font-size:12px; }
 #side td { padding:3px 4px; vertical-align:top; border-bottom:1px solid #e2e8f0;
            word-break:break-word; }
 #side td.k { color:#4a5568; width:38%; }
 .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:11px; }
 .legend span { display:inline-flex; align-items:center; gap:5px; }
 .dot { width:11px; height:11px; border-radius:3px; display:inline-block; }
 .ico { width:22px; height:18px; object-fit:contain; vertical-align:middle;
        border-radius:3px; padding:1px; }
 .line { width:18px; height:0; display:inline-block; }
 .muted { color:#718096; }
</style>
</head>
<body>
<header>
  <h1>LinkFinder topology</h1>
  <span class="meta">__BYLINE__</span>
  <span class="meta">seed __SEED__ &middot; __SUMMARY__ &middot; generated __GENERATED__</span>
  <span class="meta" id="stopnote"></span>
</header>
<div id="bar">
  <label>layout
    <select id="layout">
      <option value="cose">force</option>
      <option value="breadthfirst">tree from seed</option>
      <option value="concentric">concentric</option>
      <option value="grid">grid</option>
    </select>
  </label>
  <input id="filter" placeholder="filter by name, IP, chassis..." size="24">
  <label><input type="checkbox" id="showUnscanned" checked> unscanned</label>
  <label><input type="checkbox" id="showLabels" checked> interface labels</label>
  <label><input type="checkbox" id="showIcons" checked> device icons</label>
  <span id="layers">layer
    <label><input type="radio" name="layer" value="physical" checked> physical</label>
    <label><input type="radio" name="layer" value="ptp"> PTP</label>
    <label><input type="radio" name="layer" value="problems"> problems</label>
  </span>
  <button id="fit">fit</button>
  <span class="legend" id="legend"></span>
  <span class="legend" id="layerlegend"></span>
</div>
<div id="wrap">
  <div id="cy"></div>
  <div id="side">
    <h2>Click a node or a link</h2>
    <p class="muted">Drag to move, scroll to zoom, drag the background to pan.</p>
  </div>
</div>
<script>__CYTOSCAPE__</script>
<script>
const TOPOLOGY = __DATA__;
const ELEMENTS = __ELEMENTS__;
const KIND_STYLE = __KIND_STYLE__;
const EDGE_STYLE = __EDGE_STYLE__;
const ICONS = __ICONS__;
const PTP_STYLE = __PTP_STYLE__;
const VERDICT_STYLE = __VERDICT_STYLE__;

function iconFor(n) { return ICONS[n.data('icon')] || ICONS.unknown; }

if (TOPOLOGY.stopped_because) {
  document.getElementById('stopnote').textContent =
    'incomplete: ' + TOPOLOGY.stopped_because;
}
const legend = document.getElementById('legend');
Object.keys(KIND_STYLE).forEach(function (k) {
  const s = document.createElement('span');
  s.innerHTML = '<img class="ico" alt="" src="' + ICONS[k] + '">' + k;
  legend.appendChild(s);
});
Object.keys(EDGE_STYLE).forEach(function (k) {
  const s = document.createElement('span');
  s.innerHTML = '<i class="line" style="border-top:3px ' + EDGE_STYLE[k][1] + ' '
    + EDGE_STYLE[k][0] + '"></i>' + k;
  legend.appendChild(s);
});

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: ELEMENTS,
  wheelSensitivity: 0.2,
  maxZoom: 1.5,
  minZoom: 0.15,
  style: [
    { selector: 'node', style: {
        'shape': 'round-rectangle', 'background-color': 'data(tint)',
        'background-image': iconFor, 'background-fit': 'contain',
        'background-image-opacity': 1, 'background-width': '84%',
        'background-height': '84%',
        'border-color': 'data(border)', 'border-width': 'data(borderWidth)',
        'label': 'data(label)', 'font-size': 10, 'color': '#1a202c',
        'text-valign': 'bottom', 'text-margin-y': 4,
        'width': 'data(iconW)', 'height': 'data(iconH)',
        'text-background-color': '#ffffff', 'text-background-opacity': 0.75,
        'text-background-padding': 2 } },
    { selector: 'node.plain', style: {
        'background-color': 'data(colour)', 'shape': 'data(shape)',
        'background-image': 'none', 'width': 34, 'height': 34 } },
    { selector: 'node[state = "unreachable"]', style: {
        'background-opacity': 0.45, 'background-image-opacity': 0.5 } },
    { selector: 'node[state = "unscanned"]', style: {
        'background-opacity': 0.35, 'background-image-opacity': 0.45 } },
    { selector: 'node[state = "out-of-scope"]', style: {
        'background-opacity': 0.3, 'background-image-opacity': 0.4,
        'border-style': 'dashed' } },
    { selector: 'node[state = "limit-reached"]', style: {
        'background-opacity': 0.3, 'background-image-opacity': 0.4,
        'border-style': 'dashed' } },
    { selector: 'edge', style: {
        'width': 'data(width)', 'line-color': 'data(colour)',
        'line-style': 'data(lineStyle)', 'curve-style': 'bezier',
        'source-label': 'data(a_iface)', 'target-label': 'data(b_iface)',
        'source-text-offset': 46, 'target-text-offset': 46,
        'source-text-margin-y': -10, 'target-text-margin-y': -10,
        'font-size': 9, 'color': '#2d3748',
        'text-background-color': '#ffffff', 'text-background-opacity': 0.85,
        'text-background-padding': 2, 'edge-text-rotation': 'autorotate' } },
    { selector: 'node.ptp', style: {
        'background-image': 'none', 'shape': 'ellipse',
        'background-color': 'data(ptpColour)', 'background-opacity': 1,
        'width': 30, 'height': 30, 'border-width': 2,
        'border-color': '#ffffff' } },
    { selector: 'node.ptp[ptpRole = ""]', style: {
        'background-color': '#c9d1d9', 'width': 18, 'height': 18,
        'color': '#8b949e' } },
    { selector: 'edge.ptp', style: {
        'line-color': '#c9d1d9', 'width': 2, 'line-style': 'solid',
        'source-label': '', 'target-label': '' } },
    { selector: 'edge.ptp[ptpDomain != ""]', style: {
        'line-color': '#6f42c1', 'width': 3, 'label': 'data(ptpDomain)',
        'font-size': 9, 'text-background-color': '#ffffff',
        'text-background-opacity': 0.85, 'text-background-padding': 2 } },

    { selector: 'node.problems', style: {
        'background-opacity': 0.12, 'background-image-opacity': 0.18,
        'border-color': '#d7dde3', 'color': '#9aa4af' } },
    { selector: 'edge.problems', style: {
        'line-color': '#e3e8ed', 'width': 2, 'line-style': 'solid',
        'source-label': '', 'target-label': '' } },
    { selector: 'edge.problems[worst = "warn"]', style: {
        'line-color': 'data(problemColour)', 'width': 4,
        'label': 'data(problems)', 'font-size': 9, 'color': '#2d3748',
        'text-background-color': '#ffffff', 'text-background-opacity': 0.9,
        'text-background-padding': 2 } },
    { selector: 'edge.problems[worst = "mismatch"]', style: {
        'line-color': 'data(problemColour)', 'width': 6,
        'label': 'data(problems)', 'font-size': 10, 'color': '#2d3748',
        'text-background-color': '#ffffff', 'text-background-opacity': 0.9,
        'text-background-padding': 2 } },

    { selector: '.hidden', style: { 'display': 'none' } },
    { selector: ':selected', style: { 'border-color': '#e53e3e', 'border-width': 4 } }
  ]
});

function applyLayout(name) {
  const opts = { name: name, animate: false, padding: 40,
                 nodeDimensionsIncludeLabels: true, avoidOverlap: true };
  if (name === 'cose') {
    opts.nodeRepulsion = 26000;
    opts.idealEdgeLength = 170;
    opts.nodeOverlap = 30;
    opts.componentSpacing = 150;
    opts.gravity = 0.35;
    opts.numIter = 1500;
    opts.randomize = true;
  }
  if (name === 'concentric') { opts.minNodeSpacing = 55; }
  if (name === 'breadthfirst' || name === 'grid') { opts.spacingFactor = 1.3; }
  if (name === 'breadthfirst') {
    opts.directed = false;
    const seeds = cy.nodes().filter(function (n) {
      return (n.data('mgmt_ips') || []).indexOf(TOPOLOGY.seed) >= 0;
    });
    if (seeds.length) { opts.roots = seeds; }
  }
  const run = cy.layout(opts);
  run.one('layoutstop', function () { cy.resize(); cy.fit(cy.elements(), 40); });
  run.run();
}

window.addEventListener('resize', function () { cy.resize(); cy.fit(cy.elements(), 40); });
applyLayout('cose');
applyLayer('physical');
window.setTimeout(function () { cy.resize(); cy.fit(cy.elements(), 40); }, 400);

function syncEdges() {
  cy.edges().forEach(function (ed) {
    ed.toggleClass('hidden', ed.source().hasClass('hidden') || ed.target().hasClass('hidden'));
  });
}
document.getElementById('layout').onchange = function (e) { applyLayout(e.target.value); };
document.getElementById('fit').onclick = function () { cy.fit(cy.elements(), 30); };
document.getElementById('showLabels').onchange = function (e) {
  const on = e.target.checked;
  cy.style().selector('edge')
    .style('source-label', on ? 'data(a_iface)' : '')
    .style('target-label', on ? 'data(b_iface)' : '').update();
};
function applyLayer(name) {
  cy.elements().removeClass('ptp problems');
  if (name !== 'physical') { cy.elements().addClass(name); }
  const icons = document.getElementById('showIcons');
  icons.disabled = name !== 'physical';
  legendFor(name);
}

function legendFor(name) {
  const extra = document.getElementById('layerlegend');
  extra.innerHTML = '';
  if (name === 'ptp') {
    Object.keys(PTP_STYLE).forEach(function (role) {
      if (!role) { return; }
      const s = document.createElement('span');
      s.innerHTML = '<i class="dot" style="background:' + PTP_STYLE[role]
        + '"></i>' + role.toLowerCase();
      extra.appendChild(s);
    });
  } else if (name === 'problems') {
    ['mismatch', 'warn'].forEach(function (verdict) {
      const s = document.createElement('span');
      s.innerHTML = '<i class="line" style="border-top:4px solid '
        + VERDICT_STYLE[verdict] + '"></i>' + verdict;
      extra.appendChild(s);
    });
  }
}

Array.prototype.forEach.call(
  document.querySelectorAll('input[name="layer"]'), function (box) {
    box.onchange = function (e) { applyLayer(e.target.value); };
  });

document.getElementById('showIcons').onchange = function (e) {
  cy.nodes().toggleClass('plain', !e.target.checked);
  cy.fit(cy.elements(), 40);
};
document.getElementById('showUnscanned').onchange = function (e) {
  cy.nodes('[state = "unscanned"]').toggleClass('hidden', !e.target.checked);
  syncEdges();
};
document.getElementById('filter').oninput = function (e) {
  const q = e.target.value.trim().toLowerCase();
  cy.nodes().forEach(function (n) {
    const hay = JSON.stringify(n.data()).toLowerCase();
    n.toggleClass('hidden', q.length > 0 && hay.indexOf(q) < 0);
  });
  syncEdges();
};

const HIDE = ['colour', 'shape', 'border', 'borderWidth', 'label', 'lineStyle',
              'width', 'source', 'target', 'icon', 'tint', 'iconW', 'iconH',
              'ptpColour', 'problemColour', 'attrs', 'worst'];

function explain(data) {
  const layers = data.attrs || {};
  const names = Object.keys(layers).sort();
  if (!names.length) { return ''; }
  let out = '<h2>What was checked</h2><table>';
  names.forEach(function (name) {
    const layer = layers[name] || {};
    const verdict = layer.verdict || 'unknown';
    const colour = VERDICT_STYLE[verdict] || VERDICT_STYLE.unknown;
    let sides = '';
    if (layer.a !== undefined || layer.b !== undefined) {
      sides = ' <span class="muted">' + (layer.a === undefined ? '?' : layer.a)
        + ' / ' + (layer.b === undefined ? '?' : layer.b) + '</span>';
    }
    out += '<tr><td class="k">' + name.toUpperCase() + '</td><td>'
      + '<b style="color:' + colour + '">' + verdict + '</b>' + sides;
    if (layer.detail) { out += '<br>' + String(layer.detail); }
    (layer.evidence || []).forEach(function (line) {
      out += '<br><span class="muted">- ' + String(line) + '</span>';
    });
    out += '</td></tr>';
  });
  return out + '</table>';
}
const side = document.getElementById('side');
function rows(obj, title) {
  let out = '<h2>' + title + '</h2><table>';
  Object.keys(obj).forEach(function (k) {
    if (HIDE.indexOf(k) >= 0) { return; }
    let v = obj[k];
    if (v === null || v === undefined || v === '') { return; }
    if (Array.isArray(v)) { if (!v.length) { return; } v = v.join(', '); }
    if (typeof v === 'object') { v = JSON.stringify(v); }
    out += '<tr><td class="k">' + k + '</td><td>'
      + String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</td></tr>';
  });
  return out + '</table>';
}
function emptyPanel() {
  side.innerHTML = '<h2>Click a node or a link</h2><p class="muted">'
    + TOPOLOGY.nodes.length + ' devices, ' + TOPOLOGY.edges.length + ' links.</p>';
}
cy.on('tap', 'node', function (e) { side.innerHTML = rows(e.target.data(), 'Device'); });
cy.on('tap', 'edge', function (e) {
  const data = e.target.data();
  side.innerHTML = explain(data) + rows(data, 'Link');
});
cy.on('tap', function (e) { if (e.target === cy) { emptyPanel(); } });
</script>
</body>
</html>
